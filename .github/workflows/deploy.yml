name: Deploy SST App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Defense for: flag provided but not defined: -root
      # ubuntu-latest has Pulumi >=3.214 at /usr/local/bin/pulumi-language-nodejs
      # which removed -root (pulumi/pulumi#21065). Fixed in SST >=3.17.35.
      # Now on SST 3.19.3 - keep as safety.
      - name: Fix Pulumi version conflict
        run: sudo rm -f /usr/local/bin/pulumi-language-nodejs /usr/local/bin/pulumi

      - name: Deploy SST App
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AWS_REGION: eu-west-1
          AWS_DEFAULT_REGION: eu-west-1
          PULUMI_IGNORE_AMBIENT_PLUGINS: "true"
        run: |
          echo "AWS_REGION: $AWS_REGION"
          bunx sst deploy --stage prod
